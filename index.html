<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertisseur universel SVG → Excalidraw (Pour Eric)</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #263A58; color: #f1f5f9; }
  header { background: #1b2a42; color: #ffffff; padding: 20px 28px; border-bottom: 1px solid #3c5378; }
  header h1 { margin: 0; font-size: 22px; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  #drop { border: 2px dashed #8fa6c4; border-radius: 10px; padding: 40px; text-align: center; background: #1e3150; color: #f1f5f9; cursor: pointer; }
  #drop.over { border-color: #6cb6ea; background: #2b4a71; }
  textarea { width: 100%; height: 160px; margin-top: 16px; font-family: monospace; font-size: 13px; box-sizing: border-box; background: #0f1b2e; color: #e8eef6; border: 1px solid #4a6384; border-radius: 6px; padding: 10px; }
  textarea::placeholder { color: #8ea3be; }
  textarea:focus { outline: 2px solid #6cb6ea; outline-offset: 1px; }
  input[type="file"] { color: #f1f5f9; }
  main p { color: #f1f5f9; }
  button { background: #F59E0B; color: #0f1b2e; border: 0; padding: 12px 22px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.35); transition: background 0.15s, transform 0.1s; }
  button:hover { background: #FBBF24; transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
  button:disabled { background: #5d6d7e; color: #e5e9ee; }
  #status { margin-top: 14px; white-space: pre-wrap; font-size: 14px; color: #f1f5f9; }
  #warnings { color: #ffc27a; font-size: 13px; white-space: pre-wrap; }
  #preview { display: none; box-sizing: border-box; width: 100%; max-width: 800px; max-height: 600px; margin: 16px auto 0; padding: 12px; border: 1px solid #9fb3cc; border-radius: 8px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.25); overflow: hidden; align-items: center; justify-content: center; }
  #preview.show { display: flex; }
  #preview img { display: block; max-width: 100%; max-height: 576px; width: auto; height: auto; object-fit: contain; }
  footer { margin-top: 40px; padding: 16px 0 24px; text-align: center; font-size: 13px; color: #b4c3d6; border-top: 1px solid #3c5378; }
</style>
</head>
<body>
<header>
  <h1>Convertisseur universel SVG → Excalidraw (Pour Eric)</h1>
</header>
<main>
  <div id="drop">Glisse un fichier .svg ici ou clique pour le choisir<br><input type="file" id="file" accept=".svg,image/svg+xml" style="margin-top:12px"></div>
  <p>Ou colle le code SVG ci-dessous :</p>
  <textarea id="code" placeholder="<svg ...>...</svg>"></textarea>
  <button id="go">Convertir et télécharger le .excalidraw</button>
  <div id="status"></div>
  <div id="warnings"></div>
  <div id="preview" aria-label="Aperçu du SVG"></div>
</main>
<footer>Développé par Alix, l'assistante IA de David.</footer>
<script>
// ---------- utilitaires ----------
const round = (v, d = 3) => Math.round(v * 10 ** d) / 10 ** d;
const clamp01 = v => Math.min(1, Math.max(0, v));
const num = (v, def = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : def; };
const IDENT = [1, 0, 0, 1, 0, 0];
// Matrices [a b c d e f] : x' = a x + c y + e ; y' = b x + d y + f
const mul = (m, n) => [
  m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
  m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
  m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
const apply = (m, [x, y]) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
const isAxisAligned = m => Math.abs(m[1]) < 1e-9 && Math.abs(m[2]) < 1e-9;

// ---------- 1. parseur XML léger ----------
function decodeEntities(s) {
  return s.replace(/&(#x[0-9a-f]+|#\d+|lt|gt|amp|quot|apos);/gi, (_, e) => {
    if (e[0] === '#') return String.fromCodePoint(e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10));
    return { lt: '<', gt: '>', amp: '&', quot: '"', apos: "'" }[e.toLowerCase()];
  });
}

function parseXML(src) {
  const root = { name: '#document', attrs: {}, children: [] };
  const stack = [root];
  const re = /<!--[\s\S]*?-->|<!\[CDATA\[([\s\S]*?)\]\]>|<\?[\s\S]*?\?>|<!DOCTYPE[^>]*>|<\/([^\s>]+)\s*>|<([A-Za-z_][\w:.-]*)((?:\s+[^\s=\/>]+\s*=\s*(?:"[^"]*"|'[^']*'))*)\s*(\/?)>|([^<]+)/g;
  let m;
  while ((m = re.exec(src))) {
    const top = stack[stack.length - 1];
    if (m[1] !== undefined) {
      top.children.push({ name: '#text', text: m[1] });
    } else if (m[2] !== undefined) {
      for (let i = stack.length - 1; i > 0; i--) {
        if (stack[i].name === m[2]) { stack.length = i; break; }
      }
    } else if (m[3] !== undefined) {
      const attrs = {};
      const ar = /([^\s=]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g;
      let a;
      while ((a = ar.exec(m[4] || ''))) attrs[a[1]] = decodeEntities(a[2] !== undefined ? a[2] : a[3]);
      const el = { name: m[3], attrs, children: [] };
      top.children.push(el);
      if (!m[5]) stack.push(el);
    } else if (m[6] !== undefined) {
      top.children.push({ name: '#text', text: decodeEntities(m[6]) });
    }
  }
  return root;
}

const textOf = n => n.children.filter(c => c.name === '#text').map(c => c.text).join('');

// ---------- styles ----------
function parseDecl(str) {
  const out = {};
  for (const part of (str || '').split(';')) {
    const i = part.indexOf(':');
    if (i < 0) continue;
    const k = part.slice(0, i).trim().toLowerCase();
    const v = part.slice(i + 1).replace(/!important/i, '').trim();
    if (k && v && v !== 'inherit') out[k] = v;
  }
  return out;
}

function parseCSS(text, ctx) {
  const clean = text.replace(/\/\*[\s\S]*?\*\//g, '');
  const re = /([^{}]+)\{([^{}]*)\}/g;
  let m;
  while ((m = re.exec(clean))) {
    const decl = parseDecl(m[2]);
    for (const sel of m[1].split(',')) {
      const s = sel.trim();
      if (!s || s.startsWith('@')) continue;
      if (/[\s>+~:\[]/.test(s)) { ctx.warn(`sélecteur CSS complexe ignoré : ${s}`); continue; }
      ctx.css.push({ sel: s, decl });
    }
  }
}

function matches(sel, el) {
  if (sel === '*') return true;
  const m = /^([a-zA-Z][\w-]*)?((?:[.#][\w-]+)*)$/.exec(sel);
  if (!m) return false;
  if (m[1] && m[1] !== el.name) return false;
  const cls = (el.attrs.class || '').split(/\s+/);
  for (const p of m[2].match(/[.#][\w-]+/g) || []) {
    if (p[0] === '.' && !cls.includes(p.slice(1))) return false;
    if (p[0] === '#' && el.attrs.id !== p.slice(1)) return false;
  }
  return true;
}

const INHERIT = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-dasharray',
  'font-size', 'font-family', 'font-weight', 'text-anchor', 'color', 'visibility'];
const STYLE_PROPS = new Set([...INHERIT, 'opacity', 'display']);
const ROOT_STYLE = { fill: '#000000', stroke: 'none', 'stroke-width': '1', 'fill-opacity': '1', 'stroke-opacity': '1',
  'font-size': '16', 'font-family': 'Arial', color: '#000000', visibility: 'visible', opacity: 1 };

function computeStyle(el, parent, ctx) {
  const s = {};
  for (const k of INHERIT) s[k] = parent[k];
  const decl = {};
  for (const k of Object.keys(el.attrs)) if (STYLE_PROPS.has(k)) decl[k] = el.attrs[k];
  for (const r of ctx.css) if (matches(r.sel, el)) Object.assign(decl, r.decl);
  if (el.attrs.style) Object.assign(decl, parseDecl(el.attrs.style));
  for (const k of Object.keys(decl)) if (k !== 'opacity' && k !== 'display') s[k] = decl[k];
  let own = 1;
  if (decl.opacity !== undefined) own = decl.opacity.endsWith('%') ? num(decl.opacity) / 100 : num(decl.opacity, 1);
  s.opacity = (parent.opacity ?? 1) * clamp01(own);
  s.display = decl.display;
  return s;
}

// Couleur -> hex quand possible ; null pour none/url/transparent
function norm(v, st, ctx) {
  if (v == null) return null;
  v = String(v).trim();
  if (!v || v === 'none' || v === 'transparent') return null;
  if (/^url\(/i.test(v)) { ctx.warn('fill/stroke en url(...) (dégradé/motif) : remplacé par transparent'); return null; }
  if (v === 'currentColor') return st.color || '#000000';
  let m;
  if ((m = /^#([0-9a-f]{3})$/i.exec(v))) return '#' + [...m[1]].map(c => c + c).join('').toLowerCase();
  if (/^#[0-9a-f]{6}$/i.test(v)) return v.toLowerCase();
  if ((m = /^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i.exec(v))) {
    return '#' + [m[1], m[2], m[3]].map(c => Math.round(+c).toString(16).padStart(2, '0')).join('');
  }
  return v; // nom CSS : transmis tel quel
}

// ---------- transformations ----------
function parseTransform(str) {
  let m = IDENT;
  if (!str) return m;
  const re = /(matrix|translate|scale|rotate|skewX|skewY)\s*\(([^)]*)\)/g;
  let t;
  while ((t = re.exec(str))) {
    const a = (t[2].match(/[-+]?(?:\d*\.\d+|\d+\.?\d*)(?:[eE][-+]?\d+)?/g) || []).map(Number);
    let n = null;
    switch (t[1]) {
      case 'matrix': if (a.length === 6) n = a; break;
      case 'translate': n = [1, 0, 0, 1, a[0] || 0, a[1] || 0]; break;
      case 'scale': { const sx = a[0] ?? 1, sy = a.length > 1 ? a[1] : sx; n = [sx, 0, 0, sy, 0, 0]; break; }
      case 'rotate': {
        const r = (a[0] || 0) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
        n = [c, s, -s, c, 0, 0];
        if (a.length >= 3) n = mul(mul([1, 0, 0, 1, a[1], a[2]], n), [1, 0, 0, 1, -a[1], -a[2]]);
        break;
      }
      case 'skewX': n = [1, 0, Math.tan((a[0] || 0) * Math.PI / 180), 1, 0, 0]; break;
      case 'skewY': n = [1, Math.tan((a[0] || 0) * Math.PI / 180), 0, 1, 0, 0]; break;
    }
    if (n) m = mul(m, n);
  }
  return m;
}

// ---------- chemins SVG ----------
const ARGC = { M: 2, L: 2, T: 2, H: 1, V: 1, C: 6, S: 4, Q: 4, A: 7, Z: 0 };
const NUM_RE = /[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/y;

function cubicPts(out, x0, y0, x1, y1, x2, y2, x3, y3, steps = 16) {
  for (let i = 1; i <= steps; i++) {
    const t = i / steps, u = 1 - t;
    out.push([u*u*u*x0 + 3*u*u*t*x1 + 3*u*t*t*x2 + t*t*t*x3, u*u*u*y0 + 3*u*u*t*y1 + 3*u*t*t*y2 + t*t*t*y3]);
  }
}
function quadPts(out, x0, y0, qx, qy, x3, y3, steps = 12) {
  for (let i = 1; i <= steps; i++) {
    const t = i / steps, u = 1 - t;
    out.push([u*u*x0 + 2*u*t*qx + t*t*x3, u*u*y0 + 2*u*t*qy + t*t*y3]);
  }
}
// Arc SVG (spécification F.6.5) -> points échantillonnés
function arcPts(x1, y1, rx, ry, phiDeg, fa, fs, x2, y2, n = 32) {
  if (x1 === x2 && y1 === y2) return [];
  rx = Math.abs(rx); ry = Math.abs(ry);
  if (rx === 0 || ry === 0) return [[x2, y2]];
  const phi = phiDeg * Math.PI / 180, cos = Math.cos(phi), sin = Math.sin(phi);
  const dx = (x1 - x2) / 2, dy = (y1 - y2) / 2;
  const x1p = cos * dx + sin * dy, y1p = -sin * dx + cos * dy;
  const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
  if (lam > 1) { const s = Math.sqrt(lam); rx *= s; ry *= s; }
  const num2 = rx*rx*ry*ry - rx*rx*y1p*y1p - ry*ry*x1p*x1p;
  const den = rx*rx*y1p*y1p + ry*ry*x1p*x1p;
  let co = Math.sqrt(Math.max(0, num2 / den));
  if (fa === fs) co = -co;
  const cxp = co * rx * y1p / ry, cyp = -co * ry * x1p / rx;
  const cx = cos * cxp - sin * cyp + (x1 + x2) / 2, cy = sin * cxp + cos * cyp + (y1 + y2) / 2;
  const angle = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
  const t1 = angle(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
  let dt = angle((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
  if (!fs && dt > 0) dt -= 2 * Math.PI;
  else if (fs && dt < 0) dt += 2 * Math.PI;
  const pts = [];
  for (let i = 1; i <= n; i++) {
    const t = t1 + dt * i / n;
    const x = rx * Math.cos(t), y = ry * Math.sin(t);
    pts.push([cos * x - sin * y + cx, sin * x + cos * y + cy]);
  }
  return pts;
}

// Renvoie des sous-chemins [{pts:[[x,y]...], closed:bool}] en coordonnées utilisateur
function parsePathData(d) {
  const subs = [];
  let cur = null, i = 0, cmd = '', x = 0, y = 0, sx = 0, sy = 0, lastC = null, lastQ = null;
  const n = d.length;
  const skip = () => { while (i < n && /[\s,]/.test(d[i])) i++; };
  const readNum = () => { skip(); NUM_RE.lastIndex = i; const m = NUM_RE.exec(d); if (!m) return null; i = NUM_RE.lastIndex; return parseFloat(m[0]); };
  const readFlag = () => { skip(); const c = d[i++]; return c === '1' ? 1 : 0; };
  const start = (px, py) => { cur = { pts: [[px, py]], closed: false }; subs.push(cur); };
  for (;;) {
    skip();
    if (i >= n) break;
    if (/[a-zA-Z]/.test(d[i])) { cmd = d[i++]; if (!(cmd.toUpperCase() in ARGC)) break; }
    else if (!cmd) break;
    const C = cmd.toUpperCase(), rel = cmd !== C;
    if (C === 'Z') { if (cur) cur.closed = true; x = sx; y = sy; cur = null; cmd = ''; lastC = lastQ = null; continue; }
    const a = [];
    let bad = false;
    for (let j = 0; j < ARGC[C]; j++) {
      const isFlag = C === 'A' && (j === 3 || j === 4);
      const v = isFlag ? readFlag() : readNum();
      if (v === null) { bad = true; break; }
      a.push(v);
    }
    if (bad) break;
    const ox = rel ? x : 0, oy = rel ? y : 0;
    switch (C) {
      case 'M':
        x = a[0] + ox; y = a[1] + oy; sx = x; sy = y; start(x, y);
        cmd = rel ? 'l' : 'L'; break;
      case 'L': if (!cur) start(x, y); x = a[0] + ox; y = a[1] + oy; cur.pts.push([x, y]); break;
      case 'H': if (!cur) start(x, y); x = rel ? x + a[0] : a[0]; cur.pts.push([x, y]); break;
      case 'V': if (!cur) start(x, y); y = rel ? y + a[0] : a[0]; cur.pts.push([x, y]); break;
      case 'C': {
        if (!cur) start(x, y);
        const x2 = a[2] + ox, y2 = a[3] + oy, x3 = a[4] + ox, y3 = a[5] + oy;
        cubicPts(cur.pts, x, y, a[0] + ox, a[1] + oy, x2, y2, x3, y3);
        lastC = [x2, y2]; x = x3; y = y3; break;
      }
      case 'S': {
        if (!cur) start(x, y);
        const x1 = lastC ? 2 * x - lastC[0] : x, y1 = lastC ? 2 * y - lastC[1] : y;
        const x2 = a[0] + ox, y2 = a[1] + oy, x3 = a[2] + ox, y3 = a[3] + oy;
        cubicPts(cur.pts, x, y, x1, y1, x2, y2, x3, y3);
        lastC = [x2, y2]; x = x3; y = y3; break;
      }
      case 'Q': {
        if (!cur) start(x, y);
        const qx = a[0] + ox, qy = a[1] + oy, x3 = a[2] + ox, y3 = a[3] + oy;
        quadPts(cur.pts, x, y, qx, qy, x3, y3);
        lastQ = [qx, qy]; x = x3; y = y3; break;
      }
      case 'T': {
        if (!cur) start(x, y);
        const qx = lastQ ? 2 * x - lastQ[0] : x, qy = lastQ ? 2 * y - lastQ[1] : y;
        const x3 = a[0] + ox, y3 = a[1] + oy;
        quadPts(cur.pts, x, y, qx, qy, x3, y3);
        lastQ = [qx, qy]; x = x3; y = y3; break;
      }
      case 'A': {
        if (!cur) start(x, y);
        const x3 = a[5] + ox, y3 = a[6] + oy;
        cur.pts.push(...arcPts(x, y, a[0], a[1], a[2], a[3], a[4], x3, y3));
        x = x3; y = y3; break;
      }
    }
    if (C !== 'C' && C !== 'S') lastC = null;
    if (C !== 'Q' && C !== 'T') lastQ = null;
  }
  return subs;
}

// ---------- émission Excalidraw ----------
function styleProps(st, m, ctx) {
  const s = Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])) || 1;
  const sw = num(st['stroke-width'], 1);
  const strokeC = norm(st.stroke, st, ctx);
  const fillC = norm(st.fill, st, ctx);
  const dash = st['stroke-dasharray'] && st['stroke-dasharray'] !== 'none'
    ? st['stroke-dasharray'].split(/[\s,]+/).map(parseFloat).filter(Number.isFinite) : [];
  const alpha = st.opacity * clamp01(num(fillC ? st['fill-opacity'] : st['stroke-opacity'], 1));
  return {
    strokeColor: strokeC || 'transparent',
    backgroundColor: fillC || 'transparent',
    strokeWidth: round(Math.max(0, sw * s), 2),
    strokeStyle: dash.length ? (Math.max(...dash) <= 1.5 * sw ? 'dotted' : 'dashed') : 'solid',
    fillStyle: 'solid', roughness: 0, roundness: null,
    opacity: Math.round(clamp01(alpha) * 100),
  };
}

function pushEl(ctx, type, x, y, w, h, props, extra = {}) {
  ctx.counter += 1;
  ctx.seed = (Math.imul(ctx.seed, 1103515245) + 12345) & 0x7fffffff;
  ctx.els.push({
    id: `svg-${ctx.counter}`, type, x: round(x), y: round(y), width: round(w), height: round(h),
    angle: 0, strokeColor: '#000000', backgroundColor: 'transparent', fillStyle: 'solid',
    strokeWidth: 2, strokeStyle: 'solid', roughness: 0, opacity: 100, groupIds: [], frameId: null,
    roundness: null, seed: ctx.seed, version: 1, versionNonce: ctx.seed + 1, isDeleted: false,
    boundElements: null, updated: 1, link: null, locked: false,
    ...props, ...extra,
  });
}

function pushLine(ctx, pts, props, closed) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  pushEl(ctx, 'line', x0, y0, Math.max(...xs) - x0, Math.max(...ys) - y0, props, {
    points: pts.map(p => [round(p[0] - x0), round(p[1] - y0)]), polygon: closed,
    lastCommittedPoint: null, startBinding: null, endBinding: null, startArrowhead: null, endArrowhead: null,
  });
}

function emitPoly(ctx, subs, st, m, area) {
  const fillC = norm(st.fill, st, ctx);
  const sp = styleProps(st, m, ctx);
  for (const sub of subs) {
    if (!sub || sub.pts.length < 2) continue;
    const pts = sub.pts.map(p => apply(m, p));
    const closed = sub.closed || (area && !!fillC && pts.length >= 3);
    if (closed && pts.length >= 3) {
      const f = pts[0], l = pts[pts.length - 1];
      if (f[0] !== l[0] || f[1] !== l[1]) pts.push([f[0], f[1]]);
    }
    pushLine(ctx, pts, { ...sp, backgroundColor: closed && fillC ? fillC : 'transparent' }, closed);
  }
}

function emitRect(ctx, a, st, m) {
  const x = num(a.x), y = num(a.y), w = num(a.width), h = num(a.height);
  if (!(w > 0 && h > 0)) return;
  const rx = a.rx != null ? num(a.rx) : num(a.ry);
  const ry = a.ry != null ? num(a.ry) : rx;
  if (isAxisAligned(m)) {
    const p0 = apply(m, [x, y]), p1 = apply(m, [x + w, y + h]);
    return pushEl(ctx, 'rectangle', Math.min(p0[0], p1[0]), Math.min(p0[1], p1[1]),
      Math.abs(p1[0] - p0[0]), Math.abs(p1[1] - p0[1]),
      { ...styleProps(st, m, ctx), roundness: rx > 0 || ry > 0 ? { type: 3 } : null });
  }
  ctx.warn('rect pivoté ou cisaillé : converti en polygone (coins arrondis ignorés)');
  emitPoly(ctx, [{ pts: [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], closed: true }], st, m, true);
}

function emitEllipse(ctx, cx, cy, rx, ry, st, m) {
  if (!(rx > 0 && ry > 0)) return;
  if (isAxisAligned(m)) {
    const c = apply(m, [cx, cy]);
    const w = 2 * rx * Math.abs(m[0]), h = 2 * ry * Math.abs(m[3]);
    return pushEl(ctx, 'ellipse', c[0] - w / 2, c[1] - h / 2, w, h, styleProps(st, m, ctx));
  }
  const pts = [];
  for (let i = 0; i < 72; i++) { const t = 2 * Math.PI * i / 72; pts.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t)]); }
  emitPoly(ctx, [{ pts, closed: true }], st, m, true);
}

// Segments de texte : un tspan avec x/y commence un nouveau segment
function textRuns(node, st, ctx) {
  const runs = [];
  let cur = null;
  const pos = { x: num(node.attrs.x), y: num(node.attrs.y) };
  const walkT = (n, s) => {
    for (const c of n.children) {
      if (c.name === '#text') {
        const t = c.text.replace(/\s+/g, ' ');
        if (!cur) { cur = { x: pos.x, y: pos.y, text: '', st: s }; runs.push(cur); }
        cur.text += t;
      } else if (c.name === 'tspan' || c.name === 'a') {
        const cs = computeStyle(c, s, ctx);
        if (c.attrs.x != null || c.attrs.y != null) {
          if (c.attrs.x != null) pos.x = num(c.attrs.x);
          if (c.attrs.y != null) pos.y = num(c.attrs.y);
          cur = { x: pos.x, y: pos.y, text: '', st: cs }; runs.push(cur);
        }
        walkT(c, cs);
      }
    }
  };
  walkT(node, st);
  return runs.map(r => ({ ...r, text: r.text.trim() })).filter(r => r.text);
}

function emitText(ctx, node, st, m) {
  if (st.display === 'none') return;
  const scale = Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])) || 1;
  for (const r of textRuns(node, st, ctx)) {
    const rs = r.st;
    const size = num(rs['font-size'], 16) * scale;
    const anchor = rs['text-anchor'] || 'start';
    const q = apply(m, [r.x, r.y]);
    const w = r.text.length * size * 0.6;
    let left = q[0];
    if (anchor === 'middle') left = q[0] - w / 2;
    else if (anchor === 'end') left = q[0] - w;
    const color = norm(rs.fill, rs, ctx) || norm(rs.stroke, rs, ctx) || '#000000';
    pushEl(ctx, 'text', left, q[1] - size * 0.8, w, size * 1.25, {
      ...styleProps(rs, m, ctx), strokeColor: color, backgroundColor: 'transparent',
      text: r.text, originalText: r.text, fontSize: round(size, 2), fontFamily: 2,
      textAlign: anchor === 'middle' ? 'center' : anchor === 'end' ? 'right' : 'left',
      verticalAlign: 'top', lineHeight: 1.25, containerId: null, autoResize: true,
      angle: round(Math.atan2(m[1], m[0]), 4),
    });
  }
}

function emitShape(node, st, m, ctx) {
  const a = node.attrs;
  switch (node.name) {
    case 'rect': return emitRect(ctx, a, st, m);
    case 'circle': { const r = num(a.r); return emitEllipse(ctx, num(a.cx), num(a.cy), r, r, st, m); }
    case 'ellipse': return emitEllipse(ctx, num(a.cx), num(a.cy), num(a.rx), num(a.ry), st, m);
    case 'line':
      return emitPoly(ctx, [{ pts: [[num(a.x1), num(a.y1)], [num(a.x2), num(a.y2)]], closed: false }], st, m, false);
    case 'polyline':
    case 'polygon': {
      const nums = (a.points || '').match(/[-+]?(?:\d*\.\d+|\d+\.?\d*)(?:[eE][-+]?\d+)?/g) || [];
      const pts = [];
      for (let i = 0; i + 1 < nums.length; i += 2) pts.push([+nums[i], +nums[i + 1]]);
      return emitPoly(ctx, [{ pts, closed: node.name === 'polygon' }], st, m, node.name === 'polygon');
    }
    case 'path': return emitPoly(ctx, parsePathData(a.d || ''), st, m, true);
    case 'text': return emitText(ctx, node, st, m);
  }
}

// ---------- parcours de l'arbre ----------
const SKIP = new Set(['defs', 'clipPath', 'mask', 'pattern', 'style', 'title', 'desc', 'metadata',
  'linearGradient', 'radialGradient', 'filter', 'marker', 'script', 'font', 'cursor', 'view']);
const CONTAINERS = new Set(['g', 'svg', 'a', 'switch', 'symbol']);
const SHAPES = new Set(['rect', 'circle', 'ellipse', 'line', 'polyline', 'polygon', 'path', 'text']);

function walk(node, parent, ctm, ctx, depth = 0) {
  if (node.name === '#text' || SKIP.has(node.name)) return;
  if (depth > 64) { ctx.warn("profondeur d'imbrication maximale atteinte (64) : sous-arbre ignoré"); return; }
  const st = computeStyle(node, parent, ctx);
  if (st.display === 'none' || st.visibility === 'hidden' || st.visibility === 'collapse') return;
  const m = mul(ctm, parseTransform(node.attrs.transform));
  const name = node.name;
  if (CONTAINERS.has(name)) {
    const inner = name === 'svg' ? mul(m, [1, 0, 0, 1, num(node.attrs.x), num(node.attrs.y)]) : m;
    for (const c of node.children) walk(c, st, inner, ctx, depth + 1);
    return;
  }
  if (name === 'use') {
    const ref = (node.attrs.href || node.attrs['xlink:href'] || '').replace(/^#/, '');
    const target = ctx.ids.get(ref);
    if (!target) { ctx.warn(`<use> référence introuvable : #${ref}`); return; }
    return walk(target, st, mul(m, [1, 0, 0, 1, num(node.attrs.x), num(node.attrs.y)]), ctx, depth + 1);
  }
  if (SHAPES.has(name)) return emitShape(node, st, m, ctx);
  if (name === 'image' || name === 'foreignObject') ctx.warn(`<${name}> non converti (ignoré)`);
  else ctx.warn(`élément <${name}> non géré (ignoré)`);
}

// ---------- API ----------
function svgToExcalidraw(svgText, opts = {}) {
  const warnSet = new Set();
  const ctx = {
    els: [], warnings: [], css: [], ids: new Map(), counter: 0, seed: 42,
    warn(msg) { if (!warnSet.has(msg)) { warnSet.add(msg); ctx.warnings.push(msg); } },
  };
  const docTree = parseXML(svgText);
  const root = docTree.children.find(c => c.name === 'svg');
  if (!root) throw new Error('Aucun élément <svg> racine trouvé');

  const indexNodes = n => {
    if (n.attrs && n.attrs.id) ctx.ids.set(n.attrs.id, n);
    (n.children || []).forEach(indexNodes);
  };
  indexNodes(root);
  const collectStyles = n => {
    if (n.name === 'style') parseCSS(textOf(n), ctx);
    (n.children || []).forEach(collectStyles);
  };
  collectStyles(root);

  const k = opts.scale ?? 1;
  const vb = (root.attrs.viewBox || '').trim().split(/[\s,]+/).map(Number);
  let base = k !== 1 ? [k, 0, 0, k, 0, 0] : IDENT;
  if (opts.normalize !== false && vb.length === 4 && vb.every(Number.isFinite)) {
    base = [k, 0, 0, k, -vb[0] * k, -vb[1] * k];
  }

  const rootStyle = computeStyle(root, ROOT_STYLE, ctx);
  for (const c of root.children) walk(c, rootStyle, base, ctx, 1);

  const bgDecl = parseDecl(root.attrs.style || '');
  const bgRaw = bgDecl['background-color'] || bgDecl.background || root.attrs.background || '';
  const bgColor = norm(bgRaw.match(/#[0-9a-f]{3,6}|rgba?\([^)]*\)/i)?.[0] || '#ffffff', {}, ctx) || '#ffffff';

  const byType = {};
  for (const e of ctx.els) byType[e.type] = (byType[e.type] || 0) + 1;
  const doc = {
    type: 'excalidraw', version: 2, source: 'svg-to-excalidraw',
    elements: ctx.els,
    appState: { viewBackgroundColor: bgColor, gridSize: null },
    files: {},
  };
  return { doc, warnings: ctx.warnings, stats: { elements: ctx.els.length, byType } };
}

(function () {
  var drop = document.getElementById('drop');
  var fileIn = document.getElementById('file');
  var code = document.getElementById('code');
  var go = document.getElementById('go');
  var status = document.getElementById('status');
  var warnings = document.getElementById('warnings');
  var svgText = '';
  var baseName = 'dessin';
  var preview = document.getElementById('preview');

  // Aperçu : le SVG est affiché via <img> en data URI, ce qui neutralise les scripts intégrés.
  function updatePreview(text) {
    preview.textContent = '';
    preview.classList.remove('show');
    if (!text || !text.trim()) return;
    var doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    var root = doc.documentElement;
    if (!root || root.nodeName.toLowerCase() !== 'svg' || doc.getElementsByTagName('parsererror').length) return;
    if (!root.hasAttribute('width') || !root.hasAttribute('height')) {
      var vb = (root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
      if (vb.length === 4 && vb.every(isFinite) && vb[2] > 0 && vb[3] > 0) {
        if (!root.hasAttribute('width')) root.setAttribute('width', String(vb[2]));
        if (!root.hasAttribute('height')) root.setAttribute('height', String(vb[3]));
      }
    }
    var markup = new XMLSerializer().serializeToString(root);
    var img = document.createElement('img');
    img.alt = 'Aperçu du SVG';
    img.onerror = function () { preview.textContent = ''; preview.classList.remove('show'); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup);
    preview.appendChild(img);
    preview.classList.add('show');
  }

  function readFile(f) {
    if (!f) return;
    baseName = f.name.replace(/\.svg$/i, '') || 'dessin';
    var r = new FileReader();
    r.onload = function () { svgText = String(r.result); code.value = svgText; updatePreview(svgText); status.textContent = 'Fichier chargé : ' + f.name; };
    r.readAsText(f);
  }
  code.addEventListener('input', function () { updatePreview(code.value); });
  code.addEventListener('paste', function () { setTimeout(function () { updatePreview(code.value); }, 0); });
  fileIn.addEventListener('change', function () { readFile(fileIn.files[0]); });
  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
  drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('over'); readFile(e.dataTransfer.files[0]); });

  go.addEventListener('click', function () {
    var src = code.value.trim() || svgText.trim();
    warnings.textContent = '';
    if (!src) { status.textContent = 'Aucun SVG fourni.'; return; }
    try {
      var res = svgToExcalidraw(src, { normalize: true });
      var blob = new Blob([JSON.stringify(res.doc, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = baseName + '.excalidraw';
      document.body.appendChild(a); a.click(); a.remove();
      status.textContent = 'Conversion réussie : ' + res.stats.elements + ' éléments. Fichier téléchargé : ' + baseName + '.excalidraw';
      if (res.warnings.length) warnings.textContent = 'Avertissements :\n- ' + res.warnings.join('\n- ');
    } catch (err) {
      status.textContent = 'Erreur de conversion : ' + err.message;
    }
  });
})();
</script>
